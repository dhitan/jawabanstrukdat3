<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="100%" height="auto" style="max-width: 800px; background: #FFFFFF; border-radius: 12px; border: 1px solid #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-first" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0369A1"/>
    </marker>
    <marker id="arrow-last" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C2410C"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-q" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0891B2"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <text x="30" y="28" font-size="13" font-weight="bold" fill="#0F172A">Mencari Nilai &quot;B&quot; (P berjalan dari First(L) sampai info(P) == &quot;B&quot;):</text>
  <!-- Pointer Badge First(L) -->
  <g transform="translate(193.0, 48)">
    <rect x="0" y="0" width="74.0" height="20" rx="4" fill="#0369A1"/>
    <text x="37.0" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">First(L)</text>
  </g>
  <line x1="230" y1="68" x2="230" y2="80" stroke="#0369A1" stroke-width="1.8" marker-end="url(#arrow-first)"/>
  <!-- Pointer Badge P (Ditemukan!) -->
  <g transform="translate(347.5, 48)">
    <rect x="0" y="0" width="105" height="20" rx="4" fill="#7C3AED"/>
    <text x="52.5" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">P (Ditemukan!)</text>
  </g>
  <line x1="400" y1="68" x2="400" y2="80" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow-p)"/>
  <!-- Pointer Badge Last(L) -->
  <g transform="translate(536.75, 48)">
    <rect x="0" y="0" width="66.5" height="20" rx="4" fill="#C2410C"/>
    <text x="33.25" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Last(L)</text>
  </g>
  <line x1="570" y1="68" x2="570" y2="80" stroke="#C2410C" stroke-width="1.8" marker-end="url(#arrow-last)"/>
  <!-- Node A -->
  <g transform="translate(175, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#0369A1" text-anchor="middle">A</text>
    <text x="96.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">next</text>
    <line x1="6" y1="42" x2="22" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="96.0" cy="33.0" r="3" fill="#0284C7"/>
  </g>
  <!-- Links -->
  <line x1="285" y1="104" x2="345" y2="104" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="345" y1="120" x2="285" y2="120" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- Node B -->
  <g transform="translate(345, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#CA8A04" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#CA8A04" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#854D0E" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#A16207" text-anchor="middle">B</text>
    <text x="96.0" y="12" font-size="7.5" fill="#854D0E" text-anchor="middle" font-weight="600">next</text>
    <circle cx="14.0" cy="33.0" r="3" fill="#CA8A04"/>
    <circle cx="96.0" cy="33.0" r="3" fill="#CA8A04"/>
  </g>
  <!-- Links -->
  <line x1="455" y1="104" x2="515" y2="104" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="515" y1="120" x2="455" y2="120" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- Node C -->
  <g transform="translate(515, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#0369A1" text-anchor="middle">C</text>
    <text x="96.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">next</text>
    <circle cx="14.0" cy="33.0" r="3" fill="#0284C7"/>
    <line x1="88" y1="42" x2="104" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(336.75, 145)">
    <rect x="0" y="0" width="126.5" height="19" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="1"/>
    <text x="63.25" y="13.5" font-size="10" font-weight="600" fill="#854D0E" text-anchor="middle">info(P) == target</text>
  </g>
  <g transform="translate(180, 185)">
    <rect x="0" y="0" width="440" height="46" rx="8" fill="#FEFCE8" stroke="#FEF08A" stroke-width="1.2"/>
    <text x="220" y="28" font-size="14" font-weight="bold" fill="#854D0E" text-anchor="middle">Hasil Return: Objek Node P (&quot;B&quot;)</text>
  </g>
</svg>