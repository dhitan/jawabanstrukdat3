<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="100%" height="auto" style="max-width: 820px; background: #FFFFFF; border-radius: 12px; border: 1px solid #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
