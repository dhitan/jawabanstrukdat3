<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="auto" style="max-width: 800px; background: #FFFFFF; border-radius: 12px; border: 1px solid #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-first" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0369A1"/>
    </marker>
    <marker id="arrow-last" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C2410C"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-q" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0891B2"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <text x="30" y="28" font-size="13" font-weight="bold" fill="#0F172A">1. Kondisi Awal (List masih kosong, Node baru P dialokasikan):</text>
  <!-- Pointer Badge dll.first = None -->
  <g transform="translate(172.5, 50)">
    <rect x="0" y="0" width="95" height="20" rx="4" fill="#0369A1"/>
    <text x="47.5" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">dll.first = None</text>
  </g>
  <line x1="220" y1="70" x2="220" y2="82" stroke="#0369A1" stroke-width="1.8" marker-end="url(#arrow-first)"/>
  <!-- Pointer Badge dll.last = None -->
  <g transform="translate(312.5, 50)">
    <rect x="0" y="0" width="95" height="20" rx="4" fill="#C2410C"/>
    <text x="47.5" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">dll.last = None</text>
  </g>
  <line x1="360" y1="70" x2="360" y2="82" stroke="#C2410C" stroke-width="1.8" marker-end="url(#arrow-last)"/>
  <!-- Pointer Badge P (Node Baru) -->
  <g transform="translate(532.5, 50)">
    <rect x="0" y="0" width="95" height="20" rx="4" fill="#7C3AED"/>
    <text x="47.5" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">P (Node Baru)</text>
  </g>
  <line x1="580" y1="70" x2="580" y2="82" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow-p)"/>
  <g transform="translate(170, 86)">
    <rect x="0" y="0" width="100" height="48" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="50" y="29" font-size="12" font-weight="bold" fill="#94A3B8" text-anchor="middle">None</text>
  </g>
  <g transform="translate(310, 86)">
    <rect x="0" y="0" width="100" height="48" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <text x="50" y="29" font-size="12" font-weight="bold" fill="#94A3B8" text-anchor="middle">None</text>
  </g>
  <!-- Node D -->
  <g transform="translate(525, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#16A34A" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#16A34A" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#16A34A" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#15803D" text-anchor="middle">D</text>
    <text x="96.0" y="12" font-size="7.5" fill="#16A34A" text-anchor="middle" font-weight="600">next</text>
    <line x1="6" y1="42" x2="22" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="88" y1="42" x2="104" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(497.25, 145)">
    <rect x="0" y="0" width="165.5" height="19" rx="4" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="82.75" y="13.5" font-size="10" font-weight="600" fill="#6D28D9" text-anchor="middle">P = Node(&quot;D&quot;)</text>
  </g>
  <line x1="30" y1="175" x2="770" y2="175" stroke="#E2E8F0" stroke-width="1"/>
  <text x="30" y="205" font-size="13" font-weight="bold" fill="#0F172A">2. Hasil Akhir (dll.first = P, dll.last = P):</text>
  <!-- Pointer Badge dll.first -->
  <g transform="translate(274.25, 222)">
    <rect x="0" y="0" width="81.5" height="20" rx="4" fill="#0369A1"/>
    <text x="40.75" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">dll.first</text>
  </g>
  <line x1="315" y1="242" x2="315" y2="254" stroke="#0369A1" stroke-width="1.8" marker-end="url(#arrow-first)"/>
  <!-- Pointer Badge dll.last -->
  <g transform="translate(448.0, 222)">
    <rect x="0" y="0" width="74.0" height="20" rx="4" fill="#C2410C"/>
    <text x="37.0" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">dll.last</text>
  </g>
  <line x1="485" y1="242" x2="485" y2="254" stroke="#C2410C" stroke-width="1.8" marker-end="url(#arrow-last)"/>
  <!-- Node D -->
  <g transform="translate(345, 260)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#16A34A" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#16A34A" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#16A34A" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#15803D" text-anchor="middle">D</text>
    <text x="96.0" y="12" font-size="7.5" fill="#16A34A" text-anchor="middle" font-weight="600">next</text>
    <line x1="6" y1="42" x2="22" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="88" y1="42" x2="104" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(314.0, 322)">
    <rect x="0" y="0" width="172.0" height="19" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <text x="86.0" y="13.5" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">dll.first = dll.last = P</text>
  </g>
</svg>