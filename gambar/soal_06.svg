<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="100%" height="auto" style="max-width: 800px; background: #FFFFFF; border-radius: 12px; border: 1px solid #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-first" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0369A1"/>
    </marker>
    <marker id="arrow-last" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C2410C"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-q" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0891B2"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <text x="30" y="28" font-size="13" font-weight="bold" fill="#0F172A">Penelusuran Maju (P = dll.first, lalu berulang P = P.next):</text>
  <!-- Pointer Badge P (Mulai = dll.first) -->
  <g transform="translate(165.0, 48)">
    <rect x="0" y="0" width="130" height="20" rx="4" fill="#7C3AED"/>
    <text x="65.0" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">P (Mulai = dll.first)</text>
  </g>
  <line x1="230" y1="68" x2="230" y2="80" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow-p)"/>
  <!-- Pointer Badge dll.last (Berhenti) -->
  <g transform="translate(510.0, 48)">
    <rect x="0" y="0" width="120" height="20" rx="4" fill="#C2410C"/>
    <text x="60.0" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">dll.last (Berhenti)</text>
  </g>
  <line x1="570" y1="68" x2="570" y2="80" stroke="#C2410C" stroke-width="1.8" marker-end="url(#arrow-last)"/>
  <!-- Node A -->
  <g transform="translate(175, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#0369A1" text-anchor="middle">A</text>
    <text x="96.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">next</text>
    <line x1="6" y1="42" x2="22" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="96.0" cy="33.0" r="3" fill="#0284C7"/>
  </g>
  <line x1="285" y1="112" x2="345" y2="112" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#arrow-p)"/>
  <!-- Node B -->
  <g transform="translate(345, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#0369A1" text-anchor="middle">B</text>
    <text x="96.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">next</text>
    <circle cx="14.0" cy="33.0" r="3" fill="#0284C7"/>
    <circle cx="96.0" cy="33.0" r="3" fill="#0284C7"/>
  </g>
  <line x1="455" y1="112" x2="515" y2="112" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#arrow-p)"/>
  <!-- Node C -->
  <g transform="translate(515, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#0369A1" text-anchor="middle">C</text>
    <text x="96.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">next</text>
    <circle cx="14.0" cy="33.0" r="3" fill="#0284C7"/>
    <line x1="88" y1="42" x2="104" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(180, 185)">
    <rect x="0" y="0" width="440" height="46" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2"/>
    <text x="220" y="28" font-size="14" font-weight="bold" fill="#6D28D9" text-anchor="middle">Hasil Return String:  &quot;A &lt;-&gt; B &lt;-&gt; C&quot;</text>
  </g>
</svg>