<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="auto" style="max-width: 800px; background: #FFFFFF; border-radius: 12px; border: 1px solid #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-first" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0369A1"/>
    </marker>
    <marker id="arrow-last" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C2410C"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-q" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0891B2"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <text x="30" y="28" font-size="13" font-weight="bold" fill="#0F172A">1. Kondisi Awal (List 3 Node: P = node_target.prev, Q = node_target.next, target &quot;B&quot; dihapus):</text>
  <!-- Pointer Badge P (target.prev) -->
  <g transform="translate(177.5, 48)">
    <rect x="0" y="0" width="105" height="20" rx="4" fill="#7C3AED"/>
    <text x="52.5" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">P (target.prev)</text>
  </g>
  <line x1="230" y1="68" x2="230" y2="80" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrow-p)"/>
  <!-- Pointer Badge node_target -->
  <g transform="translate(360.0, 48)">
    <rect x="0" y="0" width="80" height="20" rx="4" fill="#CA8A04"/>
    <text x="40.0" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">node_target</text>
  </g>
  <line x1="400" y1="68" x2="400" y2="80" stroke="#CA8A04" stroke-width="1.8" marker-end="url(#arrow-first)"/>
  <!-- Pointer Badge Q (target.next) -->
  <g transform="translate(517.5, 48)">
    <rect x="0" y="0" width="105" height="20" rx="4" fill="#0891B2"/>
    <text x="52.5" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Q (target.next)</text>
  </g>
  <line x1="570" y1="68" x2="570" y2="80" stroke="#0891B2" stroke-width="1.8" marker-end="url(#arrow-q)"/>
  <!-- Node A -->
  <g transform="translate(175, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#0369A1" text-anchor="middle">A</text>
    <text x="96.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">next</text>
    <line x1="6" y1="42" x2="22" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="96.0" cy="33.0" r="3" fill="#0284C7"/>
  </g>
  <!-- Links -->
  <line x1="285" y1="104" x2="345" y2="104" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="345" y1="120" x2="285" y2="120" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- Node B -->
  <g transform="translate(345, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#DC2626" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#DC2626" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#DC2626" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#B91C1C" text-anchor="middle">B</text>
    <text x="96.0" y="12" font-size="7.5" fill="#DC2626" text-anchor="middle" font-weight="600">next</text>
    <circle cx="14.0" cy="33.0" r="3" fill="#DC2626"/>
    <circle cx="96.0" cy="33.0" r="3" fill="#DC2626"/>
  </g>
  <!-- Links -->
  <line x1="455" y1="104" x2="515" y2="104" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="515" y1="120" x2="455" y2="120" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- Node C -->
  <g transform="translate(515, 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#0369A1" text-anchor="middle">C</text>
    <text x="96.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">next</text>
    <circle cx="14.0" cy="33.0" r="3" fill="#0284C7"/>
    <line x1="88" y1="42" x2="104" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(314.0, 145)">
    <rect x="0" y="0" width="172.0" height="19" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="86.0" y="13.5" font-size="10" font-weight="600" fill="#991B1B" text-anchor="middle">node_target akan dihapus</text>
  </g>
  <line x1="30" y1="175" x2="770" y2="175" stroke="#E2E8F0" stroke-width="1"/>
  <text x="30" y="205" font-size="13" font-weight="bold" fill="#0F172A">2. Hasil Akhir (P dan Q disambungkan langsung, List menjadi 2 Node):</text>
  <!-- Pointer Badge dll.first (P) -->
  <g transform="translate(272.5, 222)">
    <rect x="0" y="0" width="85" height="20" rx="4" fill="#0369A1"/>
    <text x="42.5" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">dll.first (P)</text>
  </g>
  <line x1="315" y1="242" x2="315" y2="254" stroke="#0369A1" stroke-width="1.8" marker-end="url(#arrow-first)"/>
  <!-- Pointer Badge dll.last (Q) -->
  <g transform="translate(442.5, 222)">
    <rect x="0" y="0" width="85" height="20" rx="4" fill="#C2410C"/>
    <text x="42.5" y="14" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">dll.last (Q)</text>
  </g>
  <line x1="485" y1="242" x2="485" y2="254" stroke="#C2410C" stroke-width="1.8" marker-end="url(#arrow-last)"/>
  <!-- Node A -->
  <g transform="translate(260, 260)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#0369A1" text-anchor="middle">A</text>
    <text x="96.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">next</text>
    <line x1="6" y1="42" x2="22" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="96.0" cy="33.0" r="3" fill="#0284C7"/>
  </g>
  <!-- Links -->
  <line x1="370" y1="278" x2="430" y2="278" stroke="#0284C7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="430" y1="294" x2="370" y2="294" stroke="#EA580C" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <!-- Node C -->
  <g transform="translate(430, 260)" filter="url(#shadow)">
    <rect x="0" y="0" width="110" height="52" rx="7" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.8"/>
    <rect x="28" y="0" width="54" height="52" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="28" y1="0" x2="28" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <line x1="82" y1="0" x2="82" y2="52" stroke="#0284C7" stroke-width="1.2"/>
    <text x="14.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">prev</text>
    <text x="55.0" y="33" font-size="18" font-weight="bold" fill="#0369A1" text-anchor="middle">C</text>
    <text x="96.0" y="12" font-size="7.5" fill="#64748B" text-anchor="middle" font-weight="600">next</text>
    <circle cx="14.0" cy="33.0" r="3" fill="#0284C7"/>
    <line x1="88" y1="42" x2="104" y2="16" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g transform="translate(272.75, 322)">
    <rect x="0" y="0" width="204.5" height="19" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="102.25" y="13.5" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">P.next = Q  &amp;  Q.prev = P</text>
  </g>
</svg>